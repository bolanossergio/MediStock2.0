<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - MediStock</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4 sm:p-6 lg:p-8">

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="w-full max-w-6xl min-h-[760px] bg-white rounded-[24px] shadow-2xl overflow-hidden flex flex-col lg:flex-row mx-auto">

        <!-- PANEL IZQUIERDO -->
        <section class="lg:w-[44%] min-h-[300px] lg:min-h-[760px]
                        bg-gradient-to-br from-blue-600 via-cyan-500 to-emerald-400
                        text-white p-7 sm:p-10 flex flex-col">

            <!-- VOLVER AL INICIO -->
            <a href="./index.html"
               class="flex items-center gap-2 text-sm font-medium hover:opacity-80 transition w-fit">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                <span>Volver al inicio</span>
            </a>

            <!-- CONTENIDO CENTRAL -->
            <div class="flex-1 flex flex-col items-center justify-center text-center py-8">

                <!-- LOGO -->
                <div class="w-28 h-28 sm:w-32 sm:h-32 mb-5 rounded-[24px] overflow-hidden flex items-center justify-center">
                    <img
                        src="./img/logo.png"
                        alt="Logo MediStock"
                        class="w-full h-full object-contain rounded-[24px]"
                    >
                </div>

                <!-- NOMBRE -->
                <h1 class="text-4xl lg:text-5xl font-bold tracking-tight">
                    MediStock
                </h1>

                <!-- DESCRIPCIÓN -->
                <p class="mt-4 text-base lg:text-lg max-w-xs leading-relaxed">
                    Crea tu cuenta y empieza a gestionar tu droguería de manera sencilla.
                </p>
            </div>
        </section>


        <!-- PANEL DERECHO -->
        <section class="lg:w-[56%] bg-white p-6 sm:p-10 lg:p-12 flex items-center justify-center">

            <div class="w-full max-w-md">

                <!-- TÍTULO -->
                <div class="text-center mb-8">
                    <h2 class="text-3xl sm:text-4xl font-bold text-gray-900">
                        Crear cuenta
                    </h2>

                    <div class="w-16 h-1 bg-emerald-500 rounded-full mx-auto mt-4"></div>

                    <p class="mt-3 text-sm text-gray-500">
                        Completa tus datos para registrarte
                    </p>
                </div>


                <!-- FORMULARIO -->
                <form id="registroForm" class="space-y-4">

                    <!-- NOMBRE -->
                    <div class="relative">
                        <i data-lucide="user"
                           class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-blue-600"></i>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Nombre completo"
                            required
                            class="w-full h-14 pl-12 pr-4 border border-gray-300 rounded-xl
                                   outline-none text-gray-700 placeholder-gray-500
                                   focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
                        >
                    </div>


                    <!-- USUARIO -->
                    <div class="relative">
                        <i data-lucide="at-sign"
                           class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-blue-600"></i>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Nombre de usuario"
                            required
                            class="w-full h-14 pl-12 pr-4 border border-gray-300 rounded-xl
                                   outline-none text-gray-700 placeholder-gray-500
                                   focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
                        >
                    </div>


                    <!-- CORREO -->
                    <div class="relative">
                        <i data-lucide="mail"
                           class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-blue-600"></i>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="Correo electrónico"
                            required
                            class="w-full h-14 pl-12 pr-4 border border-gray-300 rounded-xl
                                   outline-none text-gray-700 placeholder-gray-500
                                   focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
                        >
                    </div>


                    <!-- CONTRASEÑA -->
                    <div class="relative">
                        <i data-lucide="lock"
                           class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-blue-600"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Contraseña"
                            required
                            class="w-full h-14 pl-12 pr-12 border border-gray-300 rounded-xl
                                   outline-none text-gray-700 placeholder-gray-500
                                   focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
                        >

                        <button
                            type="button"
                            onclick="mostrarPassword('password', 'eyePassword')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-700 hover:text-blue-600 transition"
                            aria-label="Mostrar contraseña"
                        >
                            <i id="eyePassword" data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>


                    <!-- CONFIRMAR CONTRASEÑA -->
                    <div class="relative">
                        <i data-lucide="lock-keyhole"
                           class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-blue-600"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirmar contraseña"
                            required
                            class="w-full h-14 pl-12 pr-12 border border-gray-300 rounded-xl
                                   outline-none text-gray-700 placeholder-gray-500
                                   focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition"
                        >

                        <button
                            type="button"
                            onclick="mostrarPassword('confirmPassword', 'eyeConfirm')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-700 hover:text-blue-600 transition"
                            aria-label="Mostrar confirmación de contraseña"
                        >
                            <i id="eyeConfirm" data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>


                    <!-- TÉRMINOS -->
                    <div class="flex items-start gap-3 pt-1">
                        <input
                            type="checkbox"
                            id="terminos"
                            required
                            class="mt-1 w-4 h-4 accent-blue-600"
                        >

                        <label for="terminos" class="text-xs sm:text-sm text-gray-600 leading-5">
                            Acepto los términos y condiciones
                        </label>
                    </div>


                    <!-- MENSAJE -->
                    <p id="mensaje" class="hidden text-sm text-center rounded-lg p-2"></p>


                    <!-- BOTÓN REGISTRARSE -->
                    <button
                        type="submit"
                        class="w-full h-14 bg-blue-600 hover:bg-blue-700 active:scale-[0.98]
                               text-white font-semibold rounded-xl transition-all shadow-md"
                    >
                        Crear cuenta
                    </button>


                    <!-- ENLACE LOGIN -->
                    <p class="text-center text-sm text-gray-600 pt-2">
                        ¿Ya tienes una cuenta?
                        <a
                            href="./login.html"
                            class="font-semibold text-blue-600 hover:text-blue-800 transition"
                        >
                            Inicia sesión
                        </a>
                    </p>

                </form>
            </div>
        </section>
    </div>


    <script>
        lucide.createIcons();

        function mostrarPassword(inputId, iconId) {
            const password = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (password.type === "password") {
                password.type = "text";
                icon.setAttribute("data-lucide", "eye-off");
            } else {
                password.type = "password";
                icon.setAttribute("data-lucide", "eye");
            }

            lucide.createIcons();
        }

        document.getElementById("registroForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const mensaje = document.getElementById("mensaje");

            if (password !== confirmPassword) {
                mensaje.textContent = "Las contraseñas no coinciden.";
                mensaje.className = "text-sm text-center rounded-lg p-2 bg-red-50 text-red-600";
                return;
            }

            mensaje.textContent = "¡Cuenta creada correctamente!";
            mensaje.className = "text-sm text-center rounded-lg p-2 bg-emerald-50 text-emerald-600";
        });
    </script>

</body>
</html>
